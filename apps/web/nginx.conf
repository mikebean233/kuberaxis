server {
    listen 8080;
    root /usr/share/nginx/html;

    # The Ingress routes /api to the API; reaching it here means it isn't routed, so don't serve the SPA.
    location /api/ {
        return 404;
    }

    # Vite fingerprints asset filenames, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routes fall back to the SPA, which is always revalidated so new releases load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
