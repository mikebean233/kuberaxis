apiVersion: v1
kind: Service
metadata:
  name: {{ include "kuberaxis.api.fullname" . }}
  labels:
    {{- include "kuberaxis.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "kuberaxis.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kuberaxis.web.fullname" . }}
  labels:
    {{- include "kuberaxis.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "kuberaxis.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
