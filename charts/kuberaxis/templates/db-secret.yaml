{{- /* Fails early with a clear message when externalDatabase.host is missing. */}}
{{- $_ := include "kuberaxis.db.host" . }}
{{- $auth := include "kuberaxis.db.auth" . | fromYaml }}
{{- if not $auth.existingSecret }}
{{- $name := include "kuberaxis.db.secretName" . }}
{{- $password := $auth.password }}
{{- if and (not $password) .Values.postgresql.enabled }}
{{- /* Reuse the generated password on upgrade; a new one would lock the API out of the existing data. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
{{- end }}
{{- if not $password }}
{{- fail "externalDatabase.password or externalDatabase.existingSecret is required when postgresql.enabled is false" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kuberaxis.labels" . | nindent 4 }}
  {{- if .Values.postgresql.enabled }}
  annotations:
    # Survives uninstall alongside the data volume, so a reinstall can still log in.
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
{{- end }}
