services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: kuberaxis
      POSTGRES_PASSWORD: kuberaxis
      POSTGRES_DB: kuberaxis
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuberaxis -d kuberaxis"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
